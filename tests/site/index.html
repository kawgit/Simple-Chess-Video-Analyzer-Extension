<!doctype html><html><head><meta charset="utf-8"><title>Fake chess video</title>
<style>body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif}#player{position:relative;width:960px;height:540px;margin:40px 0 0 60px;background:#000}video{width:100%;height:100%;object-fit:contain}</style></head>
<body><div id="player"><video id="v" autoplay muted playsinline></video></div>
<script>
const params=new URLSearchParams(location.search), game=params.get('game')||'game1', hold=+(params.get('hold')||1500);
const c=document.createElement('canvas'); c.width=1280; c.height=720; const g=c.getContext('2d');
window.__idx=0;
if(params.get('blockframe')){ setTimeout(()=>{const f=document.createElement('iframe'); f.src='https://www.chess.com/game/live/123'; f.style.cssText='width:10px;height:10px'; document.body.appendChild(f);}, +(params.get('blockframe'))); }
fetch(game+'/truth.json').then(r=>r.json()).then(async t=>{
  window.__truth=t;
  const imgs=await Promise.all(t.frames.map(f=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=game+'/'+f.file;})));
  const draw=()=>{ if(window.__frozen) return; if(window.__noboard){ g.fillStyle='#2a3340'; g.fillRect(0,0,1280,720); g.fillStyle='#c9a27e'; g.beginPath(); g.arc(640,330,140,0,7); g.fill(); g.fillStyle='#fff'; g.font='40px sans-serif'; g.fillText('Thanks for watching!',450,620); } else g.drawImage(imgs[window.__idx],0,0);};
  draw();
  setInterval(draw,50);   // keep the stream producing frames
  document.getElementById('v').srcObject=c.captureStream(20);
  window.__advance=()=>{ if(window.__idx<imgs.length-1) window.__idx++; };
  window.__set=(i)=>{ window.__idx=i; };
  // simulate a YouTube ad: player gets .ad-showing, the stream goes away, then the
  // ad is skipped and the content comes back in a brand-new <video> element
  window.__ad=async()=>{
    const pl=document.getElementById('player'), v=document.getElementById('v');
    pl.classList.add('ad-showing'); v.srcObject=null;
    await new Promise(r=>setTimeout(r,2500));
    const nv=document.createElement('video'); nv.id='v'; nv.autoplay=true; nv.muted=true; nv.playsInline=true;
    v.replaceWith(nv); pl.classList.remove('ad-showing'); nv.srcObject=c.captureStream(20);
  };
  window.__ready=true;
});
</script></body></html>
